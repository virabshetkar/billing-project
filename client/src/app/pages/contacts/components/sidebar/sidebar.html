<div class="menu-bar">
  <a routerLink="/contacts"><h1>Contacts</h1></a>
</div>
<div class="options-list">
  <h3>Actions</h3>
  <ul>
    <li>
      <button type="button" (click)="sidebarPortal.close()" routerLink="/contacts/new" routerLinkActive="active">Create</button>
    </li>
  </ul>
</div>
@if (contacts.hasValue() && contacts.value()?.length > 0) {
  <h3>Contacts</h3>
  <div class="contacts-list">
    <ul>
      @for (item of contacts.value(); track $index) {
        <li>
          <button type="button" (click)="sidebarPortal.close()" [routerLink]="['/contacts', item.id]" routerLinkActive="active">{{ item.name }}</button>
        </li>
      }
    </ul>
  </div>
}
