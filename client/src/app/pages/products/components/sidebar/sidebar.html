<div class="menu-bar">
  <a routerLink="/products"><h1>Products</h1></a>
</div>

<div class="options-list">
  <h3>Actions</h3>

  <ul>
    <li>
      <button type="button" (click)="sidebarPortal.close()" routerLink="/products/new" routerLinkActive="active">Create</button>
    </li>
  </ul>
</div>

@if (products.hasValue() && products.value()?.length > 0) {
  <h3 animate.leave="item-leave">Products</h3>

  <div class="products-list">
    <ul>
      @for (item of products.value(); track item.id; let i = $index) {
        <li animate.enter="item-enter" animate.leave="item-leave" [style.--delay]="i * 50 + 'ms'">
          <button type="button" (click)="sidebarPortal.close()" [routerLink]="['/products', item.id]"  routerLinkActive="active" class="list-item-button">
            <div class="text">
            {{ item.title }}
            </div>
            <div class="id">
            {{ item.id }}
            </div>
          </button>
        </li>
      }
    </ul>
  </div>
}
