<nav>
  @if(!isDesktopView() && isSidebarAvailable()) {
    <button class="icon-button" type="button" (click)="openSidebar()"><fa-icon [icon]="icons.faBars"></fa-icon></button>
  }
  <button [cdkMenuTriggerFor]="menu">{{ currentName() }} ▾</button>
</nav>

<ng-template #menu>
  <div class="nav-list" cdkMenu>
    @for (nav of navItems; track nav.name) {
      <button cdkMenuItem [routerLink]="'/' + nav.route" routerLinkActive="active">{{ nav.name }}</button>
    }
  </div>
</ng-template>
